name: CI

on:
  push:
    branches: [ "main" ]
  # Every pull request, including ones stacked on another PR's branch, so
  # stacked PRs are tested on their own combined changes.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Check server.js syntax
        run: node -c server.js

      - name: Run tests
        run: npm test

  # The Expo iOS/Android app in mobile/ (its own dependencies and Jest
  # setup): startup, loading, error and retry behaviour, plus a check that
  # the production iOS JavaScript bundle still compiles.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Bundle for iOS (production)
        run: npx expo export --platform ios --output-dir /tmp/expo-export

  # Harvey Taxi Driver (driver-app/), a separate Expo app with its own
  # store identity: unit and app-flow tests, plus a check that the
  # production iOS and Android JavaScript bundles compile.
  driver-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Bundle for iOS and Android (production)
        run: |
          npx expo export --platform ios --output-dir /tmp/driver-export-ios
          npx expo export --platform android --output-dir /tmp/driver-export-android

  # Exercises the dispatch migrations (dispatch_ride_atomic,
  # nearest_drivers, accept_driver_offer_atomic) against a real Postgres
  # with PostGIS, built from test/db/live-baseline.sql plus the actual
  # migration files: locking/concurrency, atomicity, and execute grants.
  # Postgres 17 matches the production project's major version.
  db-functions:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      # Fails the job (never skips) if the service or PostGIS isn't usable.
      - name: Verify Postgres and PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "select version();" \
            -c "create extension if not exists postgis;" \
            -c "select postgis_full_version();"

      - name: Run database tests
        env:
          HARVEY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          HARVEY_REQUIRE_DB_TESTS: "1"
        run: npm run test:db -- --ci

      # Card-payment flow end to end against a real Postgres built from
      # production's schema (no production data), served by PostgREST like
      # Supabase, with synthetic riders/test drivers and Stripe SIMULATED
      # (no Stripe key in CI). See docs/unused-card-holds.md section 6.
      - name: Install PostgREST (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp

      - name: Run isolated card-flow suite (simulated Stripe)
        env:
          HARVEY_ISOLATED_E2E: "1"
          HARVEY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          POSTGREST_BIN: /tmp/postgrest
        run: npx jest test/stripe-isolated --runInBand --ci
