<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <div class="app-header">
      <div class="app-title">Admin Home</div>
      <div class="app-subtitle">Approve drivers after Persona and Checkr clear</div>
    </div>

    <div class="card">
      <button class="button secondary" onclick="loadDrivers()">Refresh Drivers</button>
      <div id="drivers" class="top-space"></div>
    </div>
  </div>

  <script>
    // Driver approval uses the server's real route,
    // PATCH /api/admin/drivers/:id/approve, the same one the Admin
    // Dashboard uses. The old POST /api/admin/approve-driver no longer
    // exists. Admin access comes from the signed admin session cookie.
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    const driverName = (d) => {
      const parts = [d.first_name, d.last_name].filter((x) => x && String(x).trim() && String(x) !== 'null')
      if (parts.length) return parts.join(' ')
      return [d.full_name, d.name].find((x) => x && String(x).trim() && String(x) !== 'null') || '(no name on file)'
    }
    const isApproved = (d) => String(d.approval_status || '').toLowerCase() === 'approved'

    async function loadDrivers() {
      const box = document.getElementById('drivers')
      let data = {}
      try {
        const res = await fetch('/api/admin/drivers', { credentials: 'include' })
        data = await res.json().catch(() => ({}))
        if (!res.ok || data.ok === false) throw new Error(data.error || 'Admin sign-in required.')
      } catch (err) {
        box.textContent = err.message
        return
      }
      box.innerHTML = (data.drivers || []).map((d) => `
        <div class="ride-card" data-driver-id="${esc(d.id)}">
          <div class="ride-line"><strong>${esc(driverName(d))}</strong></div>
          <div class="ride-line">${esc(d.email)}</div>
          <div class="ride-line">Approval: ${esc(d.approval_status || 'pending')} · Account: ${esc(d.status || '')}</div>
          <div class="ride-line">Checkr: ${esc(d.checkr_status || 'not started')}</div>
          ${isApproved(d)
            ? '<div class="ride-line"><strong>Approved</strong></div>'
            : `<button class="button small" data-approve="${esc(d.id)}">Approve Driver</button>`}
        </div>
      `).join('') || 'No drivers found.'
    }

    async function approveDriver(driverId) {
      if (!confirm('Approve this driver? Persona and Checkr must already be clear.')) return
      const res = await fetch('/api/admin/drivers/' + encodeURIComponent(driverId) + '/approve', {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      })
      const data = await res.json().catch(() => ({}))
      alert(res.ok && data.ok !== false ? 'Driver approved.' : (data.error || data.message || 'Could not approve driver.'))
      loadDrivers()
    }

    document.getElementById('drivers').addEventListener('click', (e) => {
      const id = e.target && e.target.getAttribute('data-approve')
      if (id) approveDriver(id)
    })

    loadDrivers()
  </script>
</body>
</html>
