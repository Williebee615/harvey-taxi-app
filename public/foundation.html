        <input

const APPLICATION_STORAGE_KEY =

  "htaf_application_draft_v1";

const applicationForm =

  document.getElementById(

    "htafApplicationForm"

  );

const applicationStatus =

  document.getElementById(

    "applicationStatus"

  );

function showApplicationStatus(

  message,

  type = "ok"

) {

  if (!applicationStatus) return;

  applicationStatus.textContent =

    message;

  applicationStatus.className =

    "copy-status show " + type;

  window.clearTimeout(

    showApplicationStatus._timer

  );

  showApplicationStatus._timer =

    window.setTimeout(() => {

      applicationStatus.className =

        "copy-status";

      applicationStatus.textContent = "";

    }, 5000);

}

function getApplicationData() {

  return {

    first_name:

      document.getElementById(

        "firstName"

      )?.value?.trim() || "",

    last_name:

      document.getElementById(

        "lastName"

      )?.value?.trim() || "",

    email:

      document.getElementById(

        "email"

      )?.value?.trim() || "",

    phone:

      document.getElementById(

        "phone"

      )?.value?.trim() || "",

    county:

      document.getElementById(

        "county"

      )?.value?.trim() || "",

    city:

      document.getElementById(

        "city"

      )?.value?.trim() || "",

    program_type:

      document.getElementById(

        "programType"

      )?.value || "",

    pickup_city:

      document.getElementById(

        "pickupCity"

      )?.value?.trim() || "",

    destination:

      document.getElementById(

        "destination"

      )?.value?.trim() || "",

    ride_date:

      document.getElementById(

        "rideDate"

      )?.value || "",

    transportation_need:

      document.getElementById(

        "transportationNeed"

      )?.value?.trim() || "",

    submitted_at:

      new Date().toISOString()

  };

}

function validateApplication() {

  let valid = true;

  const fields = [

    "firstName",

    "lastName",

    "email",

    "phone",

    "county",

    "city",

    "programType",

    "pickupCity",

    "destination",

    "rideDate",

    "transportationNeed"

  ];

  fields.forEach((id) => {

    const el =

      document.getElementById(id);

    if (!el) return;

    el.classList.remove("invalid");

    if (!String(el.value).trim()) {

      valid = false;

      el.classList.add("invalid");

    }

  });

  const consent =

    document.getElementById(

      "consent"

    );

  if (!consent?.checked) {

    valid = false;

  }

  if (!valid) {

    showApplicationStatus(

      "Please complete all required fields.",

      "err"

    );

  }

  return valid;

}

function saveDraftApplication() {

  try {

    const payload =

      getApplicationData();

    localStorage.setItem(

      APPLICATION_STORAGE_KEY,

      JSON.stringify(payload)

    );

    showApplicationStatus(

      "Application draft saved.",

      "info"

    );

    trackFoundationIntent(

      "application_draft_saved"

    );

  } catch (error) {

    showApplicationStatus(

      "Unable to save draft.",

      "err"

    );

  }

}

function loadDraftApplication() {

  try {

    const raw =

      localStorage.getItem(

        APPLICATION_STORAGE_KEY

      );

    if (!raw) return;

    const draft =

      JSON.parse(raw);

    document.getElementById(

      "firstName"

    ).value =

      draft.first_name || "";

    document.getElementById(

      "lastName"

    ).value =

      draft.last_name || "";

    document.getElementById(

      "email"

    ).value =

      draft.email || "";

    document.getElementById(

      "phone"

    ).value =

      draft.phone || "";

    document.getElementById(

      "county"

    ).value =

      draft.county || "";

    document.getElementById(

      "city"

    ).value =

      draft.city || "";

    document.getElementById(

      "programType"

    ).value =

      draft.program_type || "";

    document.getElementById(

      "pickupCity"

    ).value =

      draft.pickup_city || "";

    document.getElementById(

      "destination"

    ).value =

      draft.destination || "";

    document.getElementById(

      "rideDate"

    ).value =

      draft.ride_date || "";

    document.getElementById(

      "transportationNeed"

    ).value =

      draft.transportation_need || "";

  } catch (error) {

    console.warn(error);

  }

}

async function submitApplication(

  payload

) {

  const response = await fetch(

    `${window.HARVEY_API_BASE}/api/foundation/apply`,

    {

      method: "POST",

      headers: {

        "Content-Type":

          "application/json"

      },

      body: JSON.stringify(

        payload

      )

    }

  );

  if (!response.ok) {

    throw new Error(

      "Application submission failed."

    );

  }

  return response.json();

}

if (applicationForm) {

  applicationForm.addEventListener(

    "submit",

    async (event) => {

      event.preventDefault();

      if (

        !validateApplication()

      ) {

        return;

      }

      const submitButton =

        applicationForm.querySelector(

          'button[type="submit"]'

        );

      const originalText =

        submitButton.textContent;

      try {

        submitButton.disabled =

          true;

        submitButton.textContent =

          "Submitting...";

        const payload =

          getApplicationData();

        await submitApplication(

          payload

        );

        localStorage.removeItem(

          APPLICATION_STORAGE_KEY

        );

        applicationForm.reset();

        showApplicationStatus(

          "Application submitted successfully. HTAF will review your request.",

          "ok"

        );

        trackFoundationIntent(

          "application_submitted"

        );

      } catch (error) {

        console.error(error);

        showApplicationStatus(

          "Submission unavailable. Please try again later.",

          "err"

        );

      } finally {

        submitButton.disabled =

          false;

        submitButton.textContent =

          originalText;

      }

    }

  );

}

window.addEventListener(

  "load",

  loadDraftApplication

);
