<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Harvey Taxi | Safe Tennessee Rides, Driver Access, and Live Support</title>
  <meta name="description" content="Harvey Taxi Service LLC helps approved riders request safe Tennessee rides, connect with qualified drivers, access support, and explore clearly labeled autonomous pilot features." />
  <meta name="theme-color" content="#07111f" />

  <style>
    :root {
      --bg1: #040814;
      --bg2: #091126;
      --bg3: #101935;
      --panel: rgba(10, 17, 38, 0.90);
      --panel-2: rgba(15, 23, 52, 0.80);
      --glass: rgba(255, 255, 255, 0.04);
      --line: rgba(122, 162, 255, 0.16);
      --line-strong: rgba(122, 162, 255, 0.30);
      --text: #f4f7ff;
      --muted: #aab8de;
      --blue: #5ea0ff;
      --cyan: #63f5ff;
      --green: #6dffb3;
      --gold: #ffd76a;
      --danger: #ff7e97;
      --violet: #8c83ff;
      --ink: #07121f;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.24);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max: 1220px;
      --nav-h: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      min-height: 100%;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(99,245,255,0.11), transparent 30%),
        radial-gradient(circle at top right, rgba(94,160,255,0.10), transparent 28%),
        radial-gradient(circle at 50% 110%, rgba(109,255,179,0.06), transparent 24%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 48%, var(--bg3));
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 30px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      border: none;
      background: none;
      outline: none;
      cursor: pointer;
    }

    .shell {
      max-width: var(--max);
      margin: auto;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 12, 28, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 22px rgba(99,245,255,0.25);
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .brand-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand {
      font-weight: 900;
      letter-spacing: .12em;
      font-size: 15px;
      white-space: nowrap;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-link {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .top-link:hover {
      color: #fff;
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }

    .top-link.cta {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: var(--ink);
      border: none;
      font-weight: 800;
    }

    .announce {
      margin-bottom: 24px;
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid rgba(99,245,255,0.14);
      background: linear-gradient(135deg, rgba(99,245,255,0.10), rgba(94,160,255,0.07));
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .announce-copy strong {
      display: block;
      margin-bottom: 4px;
      color: var(--cyan);
      font-size: 15px;
    }

    .announce-copy span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .hero {
      position: relative;
      border-radius: 34px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012)), var(--panel);
      box-shadow: var(--shadow);
      padding: 40px;
      margin-bottom: 24px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: start;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(99, 245, 255, 0.2);
      background: rgba(99, 245, 255, 0.05);
      margin-bottom: 20px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
    }

    .hero-title {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: -.03em;
    }

    .hero-copy {
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 28px;
      font-size: 16px;
    }

    .action-container {
      background: rgba(4, 8, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 28px;
    }

    .action-container h4 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .secondary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .secondary-actions .btn {
      flex: 1;
      min-width: 140px;
    }

    .btn {
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: white;
      font-weight: 700;
      transition: .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.07);
      border-color: var(--line-strong);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: var(--ink);
      border: none;
      font-weight: 800;
    }

    .btn.success {
      background: linear-gradient(135deg, var(--green), #89ffd0);
      color: #062014;
      border: none;
      font-weight: 800;
    }

    .btn.autonomous {
      background: rgba(140, 131, 255, 0.15);
      color: #c9c8ff;
      border: 1px solid rgba(140, 131, 255, 0.3);
    }

    .btn.autonomous:hover {
      background: rgba(140, 131, 255, 0.25);
    }

    .btn.foundation {
      background: linear-gradient(135deg, var(--gold), #ffe9a1);
      color: #2b2200;
      border: none;
      font-weight: 800;
    }

    .btn.ghost {
      background: transparent;
      border-color: rgba(255,255,255,0.12);
    }

    .pilot-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      background: var(--violet);
      color: #fff;
    }

    .hero-points {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .hero-point {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .hero-point strong {
      display: block;
      color: #fff;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .status-card, .trust-card, .pilot-card, .foundation-card {
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    .foundation-card {
      background: linear-gradient(180deg, rgba(255,215,106,0.05), transparent), rgba(255,255,255,0.02);
      border-color: rgba(255,215,106,0.16);
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 8px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .foundation-card .eyebrow { color: var(--gold); }

    .status-card h3, .trust-card h3, .pilot-card h3, .foundation-card h3 {
      font-size: 20px;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .status-card p, .trust-card p, .pilot-card p, .foundation-card p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .status-list {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .status-item span {
      font-size: 14px;
      font-weight: 600;
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(109,255,179,0.12);
      color: var(--green);
    }

    .status-pill.info { background: rgba(99,245,255,0.12); color: var(--cyan); }
    .status-pill.pilot { background: rgba(140,131,255,0.15); color: #c9c8ff; }
    .status-pill.build { background: rgba(255,215,106,0.12); color: var(--gold); }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .mini-stat {
      padding: 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }

    .mini-stat strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
      color: white;
    }

    .mini-stat span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .support-callout {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-radius: 20px;
      border: 1px solid rgba(109,255,179,0.16);
      background: linear-gradient(135deg, rgba(109,255,179,0.06), rgba(99,245,255,0.03));
    }

    .support-callout strong {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
      color: var(--green);
    }

    .support-callout span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .section {
      margin-top: 24px;
      background: var(--panel);
      padding: 32px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section h2 {
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: -.02em;
    }

    .lead {
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid.six-steps {
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
      transition: .18s ease;
    }

    a.card:hover {
      transform: translateY(-3px);
      border-color: var(--line-strong);
      background: rgba(255,255,255,0.04);
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      color: white;
    }

    .card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      display: block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      margin-top: 16px;
    }

    .highlight {
      padding: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .highlight h3 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .highlight p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .list-item {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }

    .list-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .list-item span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      display: block;
    }

    .service-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .service-card {
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .service-card h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .service-card p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .service-card .btn {
      width: 100%;
    }

    .footer {
      margin-top: 24px;
      padding: 32px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      box-shadow: var(--shadow);
    }

    .footer-title {
      display: block;
      margin-bottom: 6px;
      font-weight: 900;
      font-size: 16px;
    }

    .footer p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 600px;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      background: rgba(6, 12, 26, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 12px env(safe-area-inset-bottom) 12px;
      z-index: 100;
    }

    .nav-btn {
      color: var(--muted);
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: 0.15s ease;
    }

    .nav-btn.active {
      color: var(--cyan);
      background: rgba(99, 245, 255, 0.06);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
