  <style>

    :root {

      --bg1: #040814;

      --bg2: #091126;

      --bg3: #101935;

      --panel: rgba(10, 17, 38, 0.92);

      --panel2: rgba(14, 22, 48, 0.78);

      --glass: rgba(255, 255, 255, 0.045);

      --line: rgba(122, 162, 255, 0.16);

      --lineStrong: rgba(122, 162, 255, 0.34);

      --text: #f4f7ff;

      --muted: #aab8de;

      --blue: #5ea0ff;

      --cyan: #63f5ff;

      --green: #6dffb3;

      --gold: #ffd76a;

      --violet: #8c83ff;

      --red: #ff6b6b;

      --ink: #07121f;

      --shadow: 0 22px 80px rgba(0, 0, 0, 0.38);

      --shadowSoft: 0 12px 34px rgba(0, 0, 0, 0.25);

      --radiusXL: 30px;

      --radiusLG: 22px;

      --max: 1220px;

      --navH: 76px;

      --safeBottom: env(safe-area-inset-bottom);

    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    html {

      scroll-behavior: smooth;

      min-height: 100%;

      background: var(--bg1);

      -webkit-font-smoothing: antialiased;

    }

    body {

      font-family:

        Inter,

        ui-sans-serif,

        system-ui,

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

      color: var(--text);

      min-height: 100vh;

      overflow-x: hidden;

      padding-bottom: calc(var(--navH) + var(--safeBottom) + 28px);

      background:

        radial-gradient(circle at top left, rgba(99, 245, 255, 0.13), transparent 30%),

        radial-gradient(circle at top right, rgba(94, 160, 255, 0.13), transparent 30%),

        radial-gradient(circle at 50% 110%, rgba(109, 255, 179, 0.08), transparent 26%),

        linear-gradient(160deg, var(--bg1), var(--bg2) 48%, var(--bg3));

    }

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background-image:

        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),

        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);

      background-size: 52px 52px;

      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 78%);

      z-index: 0;

    }

    body.high-contrast {

      --bg1: #000000;

      --bg2: #020617;

      --bg3: #020617;

      --panel: rgba(0, 0, 0, 0.96);

      --text: #ffffff;

      --muted: #e2e8f0;

      --line: rgba(255, 255, 255, 0.38);

      --lineStrong: rgba(255, 255, 255, 0.7);

    }

    body.large-text {

      font-size: 18px;

    }

    body.reduced-motion *,

    body.reduced-motion *::before,

    body.reduced-motion *::after {

      animation: none !important;

      transition: none !important;

      scroll-behavior: auto !important;

    }

    [dir="rtl"] body {

      text-align: right;

    }

    a {

      color: inherit;

      text-decoration: none;

    }

    button,

    a,

    select,

    input,

    textarea {

      font: inherit;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }

    button,

    select,

    input,

    textarea {

      border: none;

      outline: none;

    }

    button {

      cursor: pointer;

    }

    button:disabled {

      cursor: not-allowed;

      opacity: 0.6;

    }

    .hidden {

      display: none !important;

    }

    .shell {

      max-width: var(--max);

      margin: auto;

      padding: 20px 16px;

      position: relative;

      z-index: 1;

    }

    .skip-link {

      position: absolute;

      left: 16px;

      top: -120px;

      padding: 12px 16px;

      border-radius: 999px;

      background: var(--cyan);

      color: var(--ink);

      font-weight: 900;

      z-index: 99999;

      transition: 0.16s ease;

    }

    .skip-link:focus {

      top: 14px;

    }    <!-- LANGUAGE + ACCESSIBILITY PANEL -->

    .language-panel {

      margin-bottom: 18px;

      padding: 18px;

      border-radius: 26px;

      background:

        linear-gradient(

          135deg,

          rgba(99,245,255,.08),

          rgba(94,160,255,.04)

        ),

        rgba(7,12,28,.88);

      border: 1px solid var(--line);

      box-shadow: var(--shadowSoft);

      display: grid;

      grid-template-columns: 1fr auto;

      gap: 16px;

      align-items: center;

      backdrop-filter: blur(16px);

      -webkit-backdrop-filter: blur(16px);

    }

    .language-copy strong {

      display: block;

      color: var(--cyan);

      font-size: 14px;

      margin-bottom: 4px;

      font-weight: 900;

    }

    .language-copy span {

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;

    }

    .language-controls {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      justify-content: flex-end;

      align-items: center;

    }

    .select-control,

    .access-btn {

      min-height: 46px;

      padding: 0 16px;

      border-radius: 999px;

      background: rgba(255,255,255,.06);

      color: white;

      border: 1px solid var(--line);

      font-weight: 850;

      transition: .18s ease;

    }

    .access-btn.active {

      background:

        linear-gradient(

          135deg,

          var(--cyan),

          var(--blue)

        );

      color: var(--ink);

      border: none;

    }

    /* TOP NAV */

    .topbar {

      position: sticky;

      top: 12px;

      z-index: 100;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 14px;

      padding: 14px 22px;

      margin-bottom: 24px;

      border-radius: 999px;

      background: rgba(7,12,28,.88);

      border: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(20px);

      -webkit-backdrop-filter: blur(20px);

      box-shadow: var(--shadow);

    }

    .brand-wrap {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }

    .logo-mark {

      width: 50px;

      height: 50px;

      border-radius: 16px;

      display: grid;

      place-items: center;

      background:

        linear-gradient(

          135deg,

          var(--cyan),

          var(--blue)

        );

      color: var(--ink);

      font-size: 15px;

      font-weight: 950;

      box-shadow:

        0 0 26px rgba(99,245,255,.28);

      flex-shrink: 0;

    }

    .brand-stack {

      display: flex;

      flex-direction: column;

      min-width: 0;

    }

    .brand {

      font-size: 15px;

      font-weight: 950;

      letter-spacing: .14em;

      white-space: nowrap;

    }

    .brand-sub {

      color: var(--muted);

      font-size: 11px;

      white-space: nowrap;

    }

    .top-links {

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .top-link {

      padding: 10px 16px;

      border-radius: 999px;

      background: rgba(255,255,255,.025);

      border: 1px solid rgba(255,255,255,.05);

      color: var(--muted);

      font-size: 13px;

      font-weight: 850;

      transition: .18s ease;

      white-space: nowrap;

    }

    .top-link:hover,

    .top-link:focus-visible {

      color: white;

      border-color:

        rgba(255,255,255,.15);

      background:

        rgba(255,255,255,.08);

      transform: translateY(-1px);

    }

    .top-link.cta {

      background:

        linear-gradient(

          135deg,

          var(--cyan),

          var(--blue)

        );

      color: var(--ink);

      border: none;

      box-shadow:

        0 10px 24px rgba(94,160,255,.25);

    }

    /* ANNOUNCEMENT BAR */

    .announce {

      margin-bottom: 24px;

      padding: 18px 22px;

      border-radius: 24px;

      border: 1px solid rgba(99,245,255,.15);

      background:

        linear-gradient(

          135deg,

          rgba(99,245,255,.10),

          rgba(94,160,255,.05)

        ),

        rgba(255,255,255,.02);

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 18px;

      box-shadow: var(--shadowSoft);

    }

    .announce-copy strong {

      display: block;

      color: var(--cyan);

      margin-bottom: 5px;

      font-size: 15px;

      font-weight: 900;

    }

    .announce-copy span {

      display: block;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.6;

    }

    /* INCLUSION STRIP */

    .inclusive-strip {

      margin-bottom: 24px;

      padding: 20px 24px;

      border-radius: 24px;

      background:

        linear-gradient(

          135deg,

          rgba(255,215,106,.08),

          rgba(99,245,255,.05)

        ),

        rgba(255,255,255,.02);

      border: 1px solid rgba(255,215,106,.18);

      box-shadow: var(--shadowSoft);

    }

    .inclusive-strip strong {

      display: block;

      color: var(--gold);

      margin-bottom: 6px;

      font-size: 16px;

      font-weight: 900;

    }

    .inclusive-strip p {

      color: var(--muted);

      line-height: 1.7;

      font-size: 14px;

    }    /* HERO SECTION */

    .hero {

      position: relative;

      border-radius: 36px;

      border: 1px solid var(--line);

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,.055),

          rgba(255,255,255,.014)

        ),

        var(--panel);

      box-shadow: var(--shadow);

      padding: clamp(24px,4vw,44px);

      margin-bottom: 24px;

      overflow: hidden;

      isolation: isolate;

    }

    .hero::before {

      content: "";

      position: absolute;

      inset: -1px;

      background:

        radial-gradient(

          circle at 16% 0%,

          rgba(99,245,255,.16),

          transparent 34%

        ),

        radial-gradient(

          circle at 86% 12%,

          rgba(140,131,255,.18),

          transparent 34%

        ),

        radial-gradient(

          circle at 50% 105%,

          rgba(109,255,179,.10),

          transparent 30%

        );

      pointer-events: none;

      z-index: -1;

    }

    .hero::after {

      content: "";

      position: absolute;

      width: 520px;

      height: 520px;

      right: -210px;

      top: -210px;

      border-radius: 999px;

      background:

        radial-gradient(

          circle,

          rgba(99,245,255,.13),

          transparent 68%

        );

      pointer-events: none;

    }

    .hero-grid {

      display: grid;

      grid-template-columns:

        minmax(0,1.15fr)

        minmax(320px,.85fr);

      gap: 34px;

      align-items: start;

    }

    .hero-badge {

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 9px 16px;

      border-radius: 999px;

      margin-bottom: 20px;

      color: var(--cyan);

      background:

        rgba(99,245,255,.065);

      border:

        1px solid rgba(99,245,255,.24);

      font-size: 12px;

      font-weight: 950;

      letter-spacing: .08em;

      text-transform: uppercase;

    }

    .hero-badge::before {

      content: "";

      width: 9px;

      height: 9px;

      border-radius: 999px;

      background: var(--green);

      box-shadow:

        0 0 0 6px rgba(109,255,179,.12),

        0 0 18px rgba(109,255,179,.35);

    }

    .hero-title {

      max-width: 860px;

      font-size:

        clamp(

          2.55rem,

          5.7vw,

          4.35rem

        );

      line-height: 1.02;

      letter-spacing: -.06em;

      margin-bottom: 18px;

      font-weight: 1000;

    }

    .gradient-text {

      background:

        linear-gradient(

          135deg,

          #ffffff,

          var(--cyan),

          var(--blue)

        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

    }

    .hero-copy {

      max-width: 780px;

      color: var(--muted);

      line-height: 1.78;

      font-size: 16.5px;

      margin-bottom: 28px;

    }

    /* ACTION CONTAINER */

    .action-container {

      position: relative;

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,.05),

          rgba(255,255,255,.018)

        ),

        rgba(4,8,20,.62);

      border:

        1px solid rgba(255,255,255,.075);

      padding: 24px;

      border-radius: 24px;

      margin-bottom: 28px;

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.04),

        0 18px 50px rgba(0,0,0,.22);

    }

    .action-container h4 {

      font-size: 13px;

      text-transform: uppercase;

      letter-spacing: .12em;

      color: var(--muted);

      margin-bottom: 14px;

      font-weight: 950;

    }

    .primary-actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-bottom: 14px;

    }

    .secondary-actions,

    .actions {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

    }

    .secondary-actions .btn {

      flex: 1;

      min-width: 150px;

    }

    /* BUTTON SYSTEM */

    .btn {

      position: relative;

      min-height: 54px;

      padding: 14px 20px;

      border-radius: 16px;

      border: 1px solid var(--line);

      background:

        rgba(255,255,255,.045);

      color: white;

      font-weight: 900;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      text-align: center;

      overflow: hidden;

      transition: .18s ease;

    }

    .btn::after {

      content: "";

      position: absolute;

      inset: 0;

      background:

        linear-gradient(

          120deg,

          transparent,

          rgba(255,255,255,.12),

          transparent

        );

      transform: translateX(-120%);

      transition: .45s ease;

    }

    .btn:hover::after {

      transform: translateX(120%);

    }

    .btn:hover,

    .btn:focus-visible {

      transform: translateY(-2px);

      background:

        rgba(255,255,255,.085);

      border-color:

        var(--lineStrong);

    }

    .btn.primary {

      background:

        linear-gradient(

          135deg,

          var(--cyan),

          var(--blue)

        );

      color: var(--ink);

      border: none;

      box-shadow:

        0 14px 34px rgba(94,160,255,.25);

    }

    .btn.success {

      background:

        linear-gradient(

          135deg,

          var(--green),

          #89ffd0

        );

      color: #062014;

      border: none;

    }

    .btn.foundation {

      background:

        linear-gradient(

          135deg,

          var(--gold),

          #ffe9a1

        );

      color: #2b2200;

      border: none;

    }

    .btn.autonomous {

      background:

        rgba(140,131,255,.15);

      color: #d8d6ff;

      border:

        1px solid rgba(140,131,255,.34);

    }

    .btn.ghost {

      background: transparent;

      border-color:

        rgba(255,255,255,.13);

    }

    .pilot-tag {

      display: inline-flex;

      align-items: center;

      padding: 2px 7px;

      border-radius: 5px;

      font-size: 10px;

      font-weight: 950;

      background: var(--violet);

      color: white;

    }    /* HERO FEATURE POINTS */

    .hero-points {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 12px;

    }

    .hero-point {

      padding: 17px;

      border-radius: 18px;

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,.035),

          rgba(255,255,255,.015)

        );

      border:

        1px solid rgba(255,255,255,.06);

      color: var(--muted);

      font-size: 14px;

      line-height: 1.58;

      transition: .18s ease;

    }

    .hero-point:hover {

      transform: translateY(-2px);

      border-color:

        var(--lineStrong);

      background:

        rgba(255,255,255,.045);

    }

    .hero-point strong {

      display: block;

      color: #fff;

      margin-bottom: 6px;

      font-size: 15px;

      font-weight: 900;

    }

    /* HERO SIDEBAR */

    .hero-side {

      display: flex;

      flex-direction: column;

      gap: 16px;

    }

    .status-card,

    .foundation-card,

    .community-card {

      padding: 24px;

      border-radius: 24px;

      border:

        1px solid rgba(255,255,255,.07);

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,.04),

          rgba(255,255,255,.015)

        );

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.04);

    }

    .foundation-card {

      background:

        linear-gradient(

          180deg,

          rgba(255,215,106,.08),

          rgba(255,255,255,.015)

        );

      border-color:

        rgba(255,215,106,.2);

    }

    .community-card {

      background:

        linear-gradient(

          180deg,

          rgba(140,131,255,.09),

          rgba(255,255,255,.015)

        );

      border-color:

        rgba(140,131,255,.22);

    }

    .eyebrow {

      display: inline-flex;

      margin-bottom: 8px;

      color: var(--cyan);

      font-size: 11px;

      font-weight: 950;

      letter-spacing: .08em;

      text-transform: uppercase;

    }

    .foundation-card .eyebrow {

      color: var(--gold);

    }

    .community-card .eyebrow {

      color: #c9c8ff;

    }

    .status-card h3,

    .foundation-card h3,

    .community-card h3 {

      font-size: 20px;

      margin-bottom: 12px;

      letter-spacing: -.02em;

      font-weight: 950;

    }

    .status-card p,

    .foundation-card p,

    .community-card p {

      color: var(--muted);

      line-height: 1.65;

      font-size: 14px;

    }

    /* STATUS SYSTEM */

    .status-list {

      display: grid;

      gap: 10px;

      margin-top: 16px;

    }

    .status-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      padding: 13px 16px;

      border-radius: 15px;

      background:

        rgba(255,255,255,.025);

      border:

        1px solid rgba(255,255,255,.05);

      transition: .18s ease;

    }

    .status-item:hover {

      background:

        rgba(255,255,255,.045);

      border-color:

        var(--lineStrong);

    }

    .status-item span {

      font-size: 14px;

      font-weight: 850;

    }

    .status-pill {

      padding: 5px 11px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 950;

      white-space: nowrap;

      background:

        rgba(109,255,179,.12);

      color: var(--green);

    }

    .status-pill.info {

      background:

        rgba(99,245,255,.12);

      color: var(--cyan);

    }

    .status-pill.pilot {

      background:

        rgba(140,131,255,.16);

      color: #d5d3ff;

    }

    .status-pill.build {

      background:

        rgba(255,215,106,.14);

      color: var(--gold);

    }

    /* MINI STATS */

    .mini-stats {

      display: grid;

      grid-template-columns:

        repeat(4,1fr);

      gap: 16px;

      margin-top: 24px;

    }

    .mini-stat {

      padding: 22px;

      border-radius: 20px;

      border:

        1px solid rgba(255,255,255,.06);

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,.04),

          rgba(255,255,255,.015)

        );

      transition: .18s ease;

    }

    .mini-stat:hover {

      transform: translateY(-3px);

      border-color:

        var(--lineStrong);

      background:

        rgba(255,255,255,.05);

    }

    .mini-stat strong {

      display: block;

      font-size: 17px;

      color: #fff;

      margin-bottom: 8px;

      font-weight: 900;

    }

    .mini-stat span {

      color: var(--muted);

      font-size: 13px;

      line-height: 1.65;

    }

    /* SUPPORT CALLOUT */

    .support-callout {

      margin-top: 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 18px;

      padding: 22px 24px;

      border-radius: 22px;

      border:

        1px solid rgba(109,255,179,.18);

      background:

        linear-gradient(

          135deg,

          rgba(109,255,179,.06),

          rgba(99,245,255,.03)

        );

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.04);

    }

    .support-callout strong {

      display: block;

      color: var(--green);

      margin-bottom: 5px;

      font-size: 16px;

      font-weight: 950;

    }

    .support-callout span {

      color: var(--muted);

      font-size: 14px;

      line-height: 1.65;

    }    /* MAIN SECTION SYSTEM */

    .section {

      position: relative;

      margin-top: 24px;

      padding: 34px;

      border-radius: var(--radius-xl);

      background: var(--panel);

</head><script>

/* ==========================================

   HARVEY TAXI CODE BLUE V14

   SINGLE AI WIDGET EDITION

   ========================================== */

const HARVEY_APP_VERSION = "home-v14-production";

window.HARVEY_API_BASE =

  window.location.origin &&

  window.location.origin.includes("http")

    ? window.location.origin

    : "https://harvey-taxi-app-2.onrender.com";

const STORAGE_KEYS = {

  language: "harvey_language",

  highContrast: "harvey_high_contrast",

  largeText: "harvey_large_text",

  reducedMotion: "harvey_reduced_motion"

};

/* ------------------------------------------

   STORAGE HELPERS

------------------------------------------ */

function safeStorageGet(key, fallback = "") {

  try {

    return localStorage.getItem(key) || fallback;

  } catch {

    return fallback;

  }

}

function safeStorageSet(key, value) {

  try {

    localStorage.setItem(key, String(value));

  } catch {}

}

/* ------------------------------------------

   ANALYTICS

------------------------------------------ */

function trackHarveyEvent(name, params = {}) {

  try {

    if (typeof gtag === "function") {

      gtag("event", name, {

        app_name: "Harvey Taxi",

        app_version: HARVEY_APP_VERSION,

        page_location: location.href,

        ...params

      });

    }

  } catch {}

}

/* ------------------------------------------

   NAVIGATION

------------------------------------------ */

function safeGo(path, eventName = "navigation") {

  trackHarveyEvent(eventName, {

    destination: path

  });

  location.href = path;

}

window.safeGo = safeGo;

/* ------------------------------------------

   ACCESSIBILITY

------------------------------------------ */

function restoreAccessibility() {

  const hc =

    safeStorageGet(STORAGE_KEYS.highContrast) === "1";

  const lt =

    safeStorageGet(STORAGE_KEYS.largeText) === "1";

  const rm =

    safeStorageGet(STORAGE_KEYS.reducedMotion) === "1";

  document.body.classList.toggle(

    "high-contrast",

    hc

  );

  document.body.classList.toggle(

    "large-text",

    lt

  );

  document.body.classList.toggle(

    "reduced-motion",

    rm

  );

  document

    .getElementById("contrast-toggle")

    ?.classList.toggle("active", hc);

  document

    .getElementById("text-toggle")

    ?.classList.toggle("active", lt);

  document

    .getElementById("motion-toggle")

    ?.classList.toggle("active", rm);

}

function toggleAccessibility(

  className,

  key,

  button

) {

  const enabled =

    !document.body.classList.contains(className);

  document.body.classList.toggle(

    className,

    enabled

  );

  button?.classList.toggle(

    "active",

    enabled

  );

  safeStorageSet(

    key,

    enabled ? "1" : "0"

  );

}

function bindAccessibility() {

  document

    .getElementById("contrast-toggle")

    ?.addEventListener("click", function () {

      toggleAccessibility(

        "high-contrast",

        STORAGE_KEYS.highContrast,

        this

      );

    });

  document

    .getElementById("text-toggle")

    ?.addEventListener("click", function () {

      toggleAccessibility(

        "large-text",

        STORAGE_KEYS.largeText,

        this

      );

    });

  document

    .getElementById("motion-toggle")

    ?.addEventListener("click", function () {

      toggleAccessibility(

        "reduced-motion",

        STORAGE_KEYS.reducedMotion,

        this

      );

    });

}

/* ------------------------------------------

   LANGUAGE

------------------------------------------ */

function bindLanguageSelector() {

  const selector =

    document.getElementById("language-select");

  if (!selector) return;

  const saved =

    safeStorageGet(

      STORAGE_KEYS.language,

      "en"

    );

  selector.value = saved;

  selector.addEventListener(

    "change",

    function () {

      safeStorageSet(

        STORAGE_KEYS.language,

        this.value

      );

      if (

        typeof applyLanguage === "function"

      ) {

        applyLanguage(this.value);

      }

    }

  );

  if (

    typeof applyLanguage === "function"

  ) {

    applyLanguage(saved);

  }

}

/* ------------------------------------------

   AI SUPPORT

   ONLY ONE WIDGET ALLOWED

------------------------------------------ */

function ensureSingleAiWidget() {

  const roots =

    document.querySelectorAll(

      "#harvey-ai-chat-root"

    );

  if (roots.length > 1) {

    roots.forEach((root, index) => {

      if (index > 0) {

        root.remove();

      }

    });

  }

  let root =

    document.getElementById(

      "harvey-ai-chat-root"

    );

  if (!root) {

    root =

      document.createElement("div");

    root.id =

      "harvey-ai-chat-root";

    document.body.appendChild(root);

  }

  return root;

}

function openHarveyAiChat() {

  trackHarveyEvent(

    "ai_support_open"

  );

  ensureSingleAiWidget();

  try {

    if (

      window.HarveyAI &&

      typeof window.HarveyAI.open ===

        "function"

    ) {

      window.HarveyAI.open();

      return;

    }

    const launcher =

      document.querySelector(

        ".harvey-ai-launch"

      );

    if (

      launcher &&

      typeof launcher.click ===

        "function"

    ) {

      launcher.click();

      return;

    }

  } catch (error) {}

  location.href = "support.html";

}

window.openHarveyAiChat =

  openHarveyAiChat;

/* ------------------------------------------

   CONNECTION MONITOR

------------------------------------------ */

function monitorConnection() {

  function update() {

    trackHarveyEvent(

      navigator.onLine

        ? "online"

        : "offline"

    );

  }

  window.addEventListener(

    "online",

    update

  );

  window.addEventListener(

    "offline",

    update

  );

  update();

}

/* ------------------------------------------

   APP INIT

------------------------------------------ */

function initializeHarveyHome() {

  ensureSingleAiWidget();

  restoreAccessibility();

  bindAccessibility();

  bindLanguageSelector();

  monitorConnection();

  trackHarveyEvent(

    "homepage_loaded"

  );

  console.log(

    "Harvey Taxi V14 Initialized"

  );

}

document.addEventListener(

  "DOMContentLoaded",

  initializeHarveyHome

);

</script>
