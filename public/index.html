<script>

  const HARVEY_APP_VERSION = "code-blue-v15";

  const HARVEY_API_BASE =

    window.location.origin && window.location.origin.includes("http")

      ? window.location.origin

      : "https://harvey-taxi-app-2.onrender.com";

  const STORAGE_KEYS = {

    language: "harvey_language",

    contrast: "harvey_high_contrast",

    largeText: "harvey_large_text",

    reducedMotion: "harvey_reduced_motion"

  };

  function safeGo(path, eventName){

    trackHarveyEvent(eventName || "navigation_click", { destination:path });

    window.location.href = path;

  }

  function trackHarveyEvent(name, params = {}){

    try{

      if(typeof gtag === "function"){

        gtag("event", name, {

          app_name:"Harvey Taxi",

          app_version:HARVEY_APP_VERSION,

          page_location:window.location.href,

          ...params

        });

      }

    }catch(error){

      console.warn("Tracking skipped:", error);

    }

  }

  function storageGet(key, fallback = ""){

    try{ return localStorage.getItem(key) || fallback; }

    catch{ return fallback; }

  }

  function storageSet(key, value){

    try{ localStorage.setItem(key, String(value)); }

    catch{}

  }

  function toggleAccessibility(className, key, btn){

    const active = !document.body.classList.contains(className);

    document.body.classList.toggle(className, active);

    btn?.classList.toggle("active", active);

    storageSet(key, active ? "1" : "0");

    trackHarveyEvent("accessibility_toggle", { className, active });

  }

  function restoreAccessibility(){

    const settings = [

      ["high-contrast", STORAGE_KEYS.contrast, "contrast-toggle"],

      ["large-text", STORAGE_KEYS.largeText, "text-toggle"],

      ["reduced-motion", STORAGE_KEYS.reducedMotion, "motion-toggle"]

    ];

    settings.forEach(([className, key, id]) => {

      const active = storageGet(key) === "1";

      document.body.classList.toggle(className, active);

      document.getElementById(id)?.classList.toggle("active", active);

    });

  }

  function bindAccessibility(){

    document.getElementById("contrast-toggle")?.addEventListener("click", function(){

      toggleAccessibility("high-contrast", STORAGE_KEYS.contrast, this);

    });

    document.getElementById("text-toggle")?.addEventListener("click", function(){

      toggleAccessibility("large-text", STORAGE_KEYS.largeText, this);

    });

    document.getElementById("motion-toggle")?.addEventListener("click", function(){

      toggleAccessibility("reduced-motion", STORAGE_KEYS.reducedMotion, this);

    });

  }

  function applyBatteryOptimizer(){

    const memory = navigator.deviceMemory || 4;

    const cores = navigator.hardwareConcurrency || 4;

    const connection = navigator.connection || navigator.webkitConnection || navigator.mozConnection;

    const slow = ["slow-2g","2g","3g"].includes(connection?.effectiveType);

    const lowPower = memory <= 2 || cores <= 2 || Boolean(connection?.saveData) || slow;

    if(lowPower){

      document.body.classList.add("reduced-motion");

      document.getElementById("motion-toggle")?.classList.add("active");

      storageSet(STORAGE_KEYS.reducedMotion, "1");

    }

    trackHarveyEvent("battery_optimizer_checked", {

      lowPower,

      memory,

      cores,

      effectiveType: connection?.effectiveType || "unknown"

    });

    const fab = document.getElementById("harvey-ai-fab");

    if(win){

      win.style.display = "flex";

      fab && (fab.style.display = "none");

      setTimeout(() => document.getElementById("harvey-ai-input")?.focus(), 50);

    }

  }

  function closeHarveyAiChat(){

    const win = document.getElementById("harvey-ai-window");

    const fab = document.getElementById("harvey-ai-fab");

    if(win) win.style.display = "none";

    if(fab) fab.style.display = "grid";

  }

</script><!-- PART 9 — JAVASCRIPT ENGINE FINISH -->

<script>

  const aiConversation = [];

  function appendAiMessage(text, role){

    const body = document.getElementById("harvey-ai-body");

    if(!body) return;

    const msg = document.createElement("div");

    msg.className = `ai-msg ${role}`;

    msg.textContent = text;

    body.appendChild(msg);

    body.scrollTop = body.scrollHeight;

  }

  function showAiTyping(){

    appendAiMessage("Typing…", "bot");

    const body = document.getElementById("harvey-ai-body");

    return body?.lastElementChild || null;

  }

  async function sendHarveyAiMessage(){

    const input = document.getElementById("harvey-ai-input");

    const sendBtn = document.getElementById("harvey-ai-send");

    const text = input?.value.trim();

    if(!text) return;

    input.value = "";

    sendBtn.disabled = true;

    appendAiMessage(text, "user");

    aiConversation.push({ role:"user", content:text });

    const typing = showAiTyping();

    try{

      const res = await fetch(`${HARVEY_API_BASE}/api/ai/support`, {

        method:"POST",

        headers:{ "Content-Type":"application/json" },

        body:JSON.stringify({

          message:text,

          page:"index",

          history:aiConversation.slice(-8)

        })

      });

      const data = await res.json().catch(() => ({}));

      typing?.remove();

      const reply =

        data.reply ||

        data.response ||

        "I’m here to help. Please contact Harvey Taxi support if this issue continues.";

      appendAiMessage(reply, "bot");

      aiConversation.push({ role:"assistant", content:reply });

    }catch(error){

      typing?.remove();

      appendAiMessage(

        "I’m having trouble connecting right now. Please use the Support Center or try again shortly.",

        "bot"

      );

      trackHarveyEvent("ai_support_error", { message:error.message });

    }finally{

      sendBtn.disabled = false;

      input?.focus();

    }

  }

  function bindAiInput(){

    const input = document.getElementById("harvey-ai-input");

    input?.addEventListener("keydown", event => {

      if(event.key === "Enter"){

        event.preventDefault();

        sendHarveyAiMessage();

      }

    });

  }

  async function fetchPlatformHealth(){

    try{

      const res = await fetch(`${HARVEY_API_BASE}/api/health`, { cache:"no-store" });

      if(!res.ok) throw new Error("Health check failed");

      const data = await res.json();

      trackHarveyEvent("platform_health_ok");

      return data;

    }catch(error){

      trackHarveyEvent("platform_health_failed", { message:error.message });

      return null;

    }

  }

  function createWelcomeBanner(){

    try{

      if(sessionStorage.getItem("harvey_welcome_seen") === "1") return;

      sessionStorage.setItem("harvey_welcome_seen", "1");

    }catch{}

    const banner = document.createElement("div");

    banner.className = "welcome-banner";

    banner.innerHTML = `

      <div>

        Harvey Taxi Platform Loaded

        <div class="welcome-banner-sub">

          AI Support • Driver Access • HTAF • Tennessee Mobility

        </div>

      </div>

      <button class="welcome-close" type="button" aria-label="Close welcome banner">×</button>

    `;

    document.body.appendChild(banner);

    banner.querySelector(".welcome-close")?.addEventListener("click", () => banner.remove());

    setTimeout(() => banner.remove(), 7000);

  }

  function monitorConnection(){

    function update(){

      trackHarveyEvent(navigator.onLine ? "internet_online" : "internet_offline");

    }

    window.addEventListener("online", update);

    window.addEventListener("offline", update);

    update();

  }

  async function registerHarveyServiceWorker(){

    try{

      if(!("serviceWorker" in navigator)) return;

      const registration = await navigator.serviceWorker.register("/service-worker.js", {

        scope:"/"

      });

      trackHarveyEvent("service_worker_registered", {

        scope:registration.scope

      });

    }catch(error){

      trackHarveyEvent("service_worker_failed", {

        message:error.message

      });

    }

  }

  function startHeartbeat(){

    setInterval(fetchPlatformHealth, 300000);

  }

  function initializeHarveyHome(){

    restoreAccessibility();

    bindAccessibility();

    bindAiInput();

    applyBatteryOptimizer();

    monitorConnection();

    fetchPlatformHealth();

    startHeartbeat();

    registerHarveyServiceWorker();

    createWelcomeBanner();

    trackHarveyEvent("home_initialized", {

      version:HARVEY_APP_VERSION

    });

  }

  window.safeGo = safeGo;

  window.openHarveyAiChat = openHarveyAiChat;

  window.closeHarveyAiChat = closeHarveyAiChat;

  window.sendHarveyAiMessage = sendHarveyAiMessage;

  window.showUnderConstruction = showUnderConstruction;

  window.closeModal = closeModal;

  window.applyBatteryOptimizer = applyBatteryOptimizer;

  document.addEventListener("DOMContentLoaded", initializeHarveyHome);

</script>

</body>
