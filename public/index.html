  <style>

    :root {

      --bg1:#040814;

      --bg2:#091126;

      --bg3:#101935;

      --panel:rgba(10,17,38,.92);

      --panel2:rgba(14,22,48,.78);

      --glass:rgba(255,255,255,.045);

      --line:rgba(122,162,255,.16);

      --line-strong:rgba(122,162,255,.34);

      --text:#f4f7ff;

      --muted:#aab8de;

      --blue:#5ea0ff;

      --cyan:#63f5ff;

      --green:#6dffb3;

      --gold:#ffd76a;

      --violet:#8c83ff;

      --red:#ff6b6b;

      --ink:#07121f;

      --shadow:0 22px 80px rgba(0,0,0,.38);

      --shadow-soft:0 12px 34px rgba(0,0,0,.25);

      --radius-xl:30px;

      --radius-lg:22px;

      --max:1220px;

      --nav-h:76px;

      --safe-bottom:env(safe-area-inset-bottom);

    }

    * {

      box-sizing:border-box;

      margin:0;

      padding:0;

    }

    html {

      scroll-behavior:smooth;

      min-height:100%;

      background:var(--bg1);

      -webkit-font-smoothing:antialiased;

    }

    body {

      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

      color:var(--text);

      min-height:100vh;

      overflow-x:hidden;

      padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 28px);

      background:

        radial-gradient(circle at top left,rgba(99,245,255,.13),transparent 30%),

        radial-gradient(circle at top right,rgba(94,160,255,.13),transparent 30%),

        radial-gradient(circle at 50% 110%,rgba(109,255,179,.08),transparent 26%),

        linear-gradient(160deg,var(--bg1),var(--bg2) 48%,var(--bg3));

    }

    body::before {

      content:"";

      position:fixed;

      inset:0;

      pointer-events:none;

      background-image:

        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),

        linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);

      background-size:52px 52px;

      mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 78%);

      z-index:0;

    }

    body.high-contrast {

      --bg1:#000;

      --bg2:#020617;

      --bg3:#020617;

      --panel:rgba(0,0,0,.96);

      --text:#fff;

      --muted:#e2e8f0;

      --line:rgba(255,255,255,.38);

      --line-strong:rgba(255,255,255,.7);

    }

    body.large-text {

      font-size:18px;

    }

    body.reduced-motion *,

    body.reduced-motion *::before,

    body.reduced-motion *::after {

      animation:none !important;

      transition:none !important;

      scroll-behavior:auto !important;

    }

    a {

      color:inherit;

      text-decoration:none;

    }

    button,

    a,

    select,

    input,

    textarea {

      font:inherit;

      -webkit-tap-highlight-color:transparent;

      touch-action:manipulation;

    }

    button,

    select,

    input,

    textarea {

      border:none;

      outline:none;

    }

    button {

      cursor:pointer;

    }

    button:disabled {

      cursor:not-allowed;

      opacity:.6;

    }

    .shell {

      max-width:var(--max);

      margin:auto;

      padding:20px 16px;

      position:relative;

      z-index:1;

    }

    .skip-link {

      position:absolute;

      left:16px;

      top:-120px;

      padding:12px 16px;

      border-radius:999px;

      background:var(--cyan);

      color:var(--ink);

      font-weight:900;

      z-index:99999;

      transition:.16s ease;

    }

    .skip-link:focus {

      top:14px;

    }

    .language-panel {

      margin-bottom:18px;

      padding:18px;

      border-radius:26px;

      background:

        linear-gradient(135deg,rgba(99,245,255,.08),rgba(94,160,255,.04)),

        rgba(7,12,28,.88);

      border:1px solid var(--line);

      box-shadow:var(--shadow-soft);

      display:grid;

      grid-template-columns:1fr auto;

      gap:16px;

      align-items:center;

      backdrop-filter:blur(16px);

      -webkit-backdrop-filter:blur(16px);

    }

    .language-copy strong {

      display:block;

      color:var(--cyan);

      font-size:14px;

      margin-bottom:4px;

      font-weight:900;

    }

    .language-copy span {

      color:var(--muted);

      font-size:13px;

      line-height:1.6;

    }

    .language-controls {

      display:flex;

      flex-wrap:wrap;

      gap:10px;

      justify-content:flex-end;

      align-items:center;

    }

    .select-control,

    .access-btn {

      min-height:46px;

      padding:0 16px;

      border-radius:999px;

      background:rgba(255,255,255,.06);

      color:#fff;

      border:1px solid var(--line);

      font-weight:850;

      transition:.18s ease;

    }

    .select-control option {

      color:#07121f;

      background:#fff;

    }

    .access-btn.active {

      background:linear-gradient(135deg,var(--cyan),var(--blue));

      color:var(--ink);

      border:none;

    }

    .topbar {

      position:sticky;

      top:12px;

      z-index:100;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:14px;

      padding:14px 22px;

      margin-bottom:24px;

      border-radius:999px;

      background:rgba(7,12,28,.88);

      border:1px solid rgba(255,255,255,.08);

      backdrop-filter:blur(20px);

      -webkit-backdrop-filter:blur(20px);

      box-shadow:var(--shadow);

    }

    .brand-wrap {

      display:flex;

      align-items:center;

      gap:12px;

      min-width:0;

    }

    .logo-mark {

      width:48px;

      height:48px;

      border-radius:16px;

      display:grid;

      place-items:center;

      background:linear-gradient(135deg,var(--cyan),var(--blue));

      color:var(--ink);

      font-size:15px;

      font-weight:950;

      box-shadow:0 0 26px rgba(99,245,255,.28);

      flex-shrink:0;

    }

    .brand-stack {

      display:flex;

      flex-direction:column;

      min-width:0;

    }

    .brand {

      font-size:15px;

      font-weight:950;

      letter-spacing:.14em;

      white-space:nowrap;

    }

    .brand-sub {

      color:var(--muted);

      font-size:11px;

      white-space:nowrap;

    }

    .top-links {

      display:flex;

      align-items:center;

      gap:8px;

    }

    .top-link {

      padding:10px 16px;

      border-radius:999px;

      background:rgba(255,255,255,.025);

      border:1px solid rgba(255,255,255,.05);

      color:var(--muted);

      font-size:13px;

      font-weight:850;

      transition:.18s ease;

      white-space:nowrap;

    }

    .top-link:hover,

    .top-link:focus-visible {

      color:#fff;

      border-color:rgba(255,255,255,.15);

      background:rgba(255,255,255,.08);

      transform:translateY(-1px);

    }

    .top-link.cta {

      background:linear-gradient(135deg,var(--cyan),var(--blue));

      color:var(--ink);

      border:none;

      box-shadow:0 10px 24px rgba(94,160,255,.25);

    }/* ==========================

   PLATFORM LOADED BANNER

========================== */

.platform-banner {

  position: fixed;

  top: 18px;

  left: 50%;

  transform: translateX(-50%);

  width: min(760px, calc(100vw - 24px));

  z-index: 99999;

    linear-gradient(

      135deg,

      #63f5ff,

      #5ea0ff

    );

  border-radius: 34px;

  padding: 24px;

  color: #07121f;

  box-shadow:

    0 25px 60px rgba(0,0,0,.35);

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 18px;

}

.platform-banner-title {

  font-size: 20px;

  font-weight: 1000;

  line-height: 1.2;

}

.platform-banner-sub {

  margin-top: 6px;

  font-size: 15px;

  font-weight: 800;

}

.platform-banner-close {

  width: 64px;

  height: 64px;

  border-radius: 999px;

  background: #07121f;

  color: white;

  font-size: 32px;

  font-weight: 900;

  flex-shrink: 0;

}

/* ==========================

   ANNOUNCEMENT BAR

========================== */

.announce {

  margin-bottom: 24px;

  padding: 24px;

  border-radius: 30px;

  background:

    linear-gradient(

      135deg,

      rgba(99,245,255,.10),

      rgba(94,160,255,.05)

    ),

    rgba(255,255,255,.02);

  border: 1px solid rgba(99,245,255,.18);

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  box-shadow: var(--shadow-soft);

}

.announce-copy strong {

  display: block;

  color: var(--cyan);

  margin-bottom: 6px;

  font-size: 20px;

  font-weight: 950;

}

.announce-copy span {

  display: block;

  color: var(--muted);

  line-height: 1.75;

  font-size: 15px;

}

/* ==========================

   HERO

========================== */

.hero {

  position: relative;

  border-radius: 36px;

  border: 1px solid var(--line);

  background:

    linear-gradient(

      180deg,

      rgba(255,255,255,.055),

      rgba(255,255,255,.014)

    ),

    var(--panel);

  padding: clamp(28px,4vw,48px);

  overflow: hidden;

  box-shadow: var(--shadow);

}

.hero::before {

  content:"";

  position:absolute;

  inset:-1px;

  background:

    radial-gradient(

      circle at 10% 0%,

      rgba(99,245,255,.18),

      transparent 36%

    ),

    radial-gradient(

      circle at 90% 0%,

      rgba(94,160,255,.18),

      transparent 34%

    );

  pointer-events:none;

}

.hero-grid {

  display:grid;

  grid-template-columns:

    minmax(0,1.15fr)

    minmax(360px,.85fr);

  gap:38px;

}

.hero-badge {

  display:inline-flex;

  align-items:center;

  gap:10px;

  padding:10px 18px;

  border-radius:999px;

  background:

    rgba(99,245,255,.08);

  border:

    1px solid rgba(99,245,255,.24);

  color: var(--cyan);

  font-size: 12px;

  font-weight: 950;

  letter-spacing: .08em;

  text-transform: uppercase;

  margin-bottom: 20px;

}

.hero-badge::before {

  content:"";

  width:10px;

  height:10px;

  border-radius:999px;

  background: var(--green);

  box-shadow:

    0 0 0 6px rgba(109,255,179,.14),

    0 0 18px rgba(109,255,179,.34);

}

.hero-title {

  font-size:

    clamp(

      2.8rem,

      5.8vw,

      4.5rem

    );

  line-height: 1.02;

  letter-spacing: -.06em;

  margin-bottom: 18px;

  font-weight: 1000;

}

.gradient-text {

  background:

    linear-gradient(

      135deg,

      #ffffff,

      var(--cyan),

      var(--blue)

    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

}

.hero-copy {

  max-width: 760px;

  color: var(--muted);

  font-size: 17px;

  line-height: 1.85;

  margin-bottom: 28px;

}

/* ==========================

   ACTION CENTER

========================== */

.action-container {

  background:

    linear-gradient(

      180deg,

      rgba(255,255,255,.05),

      rgba(255,255,255,.02)

    );

  border:

    1px solid rgba(255,255,255,.08);

  border-radius: 26px;

  padding: 24px;

  margin-bottom: 26px;

}

.action-container h4 {

  font-size: 12px;

  text-transform: uppercase;

  letter-spacing: .12em;

  color: var(--muted);

  margin-bottom: 14px;

  font-weight: 950;

}

.primary-actions {

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-bottom:14px;

}

.secondary-actions {

  display:flex;

  flex-wrap:wrap;

  gap:10px;

}

.secondary-actions .btn {

  flex:1;

  min-width:150px;

}

/* ==========================

   BUTTON SYSTEM

========================== */

.btn {

  min-height: 56px;

  padding: 14px 20px;

  border-radius: 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  font-weight: 900;

  transition:.18s ease;

  text-align:center;

}

.btn:hover {

  transform: translateY(-2px);

}

.btn.primary {

  background:

    linear-gradient(

      135deg,

      var(--cyan),

      var(--blue)

    );

  color: var(--ink);

  box-shadow:

    0 16px 40px rgba(94,160,255,.25);

}

.btn.success {

  background:

    linear-gradient(

      135deg,

      var(--green),

      #89ffd0

    );

  color:#062014;

}

.btn.foundation {

  background:

    linear-gradient(

      135deg,

      var(--gold),

      #ffe9a1

    );

  color:#2c2200;

}

.btn.autonomous {

  background:

    rgba(140,131,255,.15);

  border:

    1px solid rgba(140,131,255,.30);

  color:#ddd9ff;

}

.btn.ghost {

  background: transparent;

  border:

    1px solid rgba(255,255,255,.12);

  color:#fff;

}/* ==========================

   HERO FEATURE POINTS

========================== */

.hero-points {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 12px;

}

.hero-point {

  padding: 18px;

  border-radius: 20px;

  background:

    linear-gradient(

      180deg,

      rgba(255,255,255,.04),

      rgba(255,255,255,.015)

    );

  border: 1px solid rgba(255,255,255,.06);

  color: var(--muted);

  font-size: 14px;

  line-height: 1.6;

  transition: .18s ease;

}

.hero-point:hover {

  transform: translateY(-2px);

  border-color: var(--line-strong);

  background: rgba(255,255,255,.045);

}

.hero-point strong {

  display: block;

  color: #fff;

  margin-bottom: 6px;

  font-size: 15px;

  font-weight: 950;

}

/* ==========================

   HERO SIDEBAR

========================== */

.hero-side {

  display: flex;

  flex-direction: column;

  gap: 16px;

}

.status-card,

.foundation-card,

.community-card {

  padding: 24px;

  border-radius: 26px;

  border: 1px solid rgba(255,255,255,.07);

  background:

    linear-gradient(

      180deg,

      rgba(255,255,255,.04),

      rgba(255,255,255,.015)

    );

  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);

}

.foundation-card {

  background:

    linear-gradient(

      180deg,

      rgba(255,215,106,.09),

      rgba(255,255,255,.015)

    );

  border-color: rgba(255,215,106,.22);

}

.community-card {

  background:

    linear-gradient(

      180deg,

      rgba(140,131,255,.10),

      rgba(255,255,255,.015)

    );

  border-color: rgba(140,131,255,.24);

}

.eyebrow {

  display: inline-flex;

  margin-bottom: 8px;

  color: var(--cyan);

  font-size: 11px;

  font-weight: 950;

  letter-spacing: .08em;

  text-transform: uppercase;

}

.foundation-card .eyebrow {

  color: var(--gold);

}

.community-card .eyebrow {

  color: #c9c8ff;

}

.status-card h3,

.foundation-card h3,

.community-card h3 {

  font-size: 20px;

  margin-bottom: 12px;

  letter-spacing: -.02em;

  font-weight: 950;

}

.status-card p,

.foundation-card p,

.community-card p {

  color: var(--muted);

  line-height: 1.65;

  font-size: 14px;

}

/* ==========================

   STATUS SYSTEM

========================== */

.status-list {

  display: grid;

  gap: 10px;

  margin-top: 16px;

}

.status-item {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  padding: 13px 16px;

  border-radius: 16px;

  background: rgba(255,255,255,.025);

  border: 1px solid rgba(255,255,255,.05);

  transition: .18s ease;

}

.status-item:hover {

  background: rgba(255,255,255,.045);

  border-color: var(--line-strong);

}

.status-item span {

  font-size: 14px;

  font-weight: 850;

}

.status-pill {

  padding: 5px 11px;

  border-radius: 999px;

  font-size: 11px;

  font-weight: 950;

  white-space: nowrap;

  background: rgba(109,255,179,.12);

  color: var(--green);

}

.status-pill.info {

  background: rgba(99,245,255,.12);

  color: var(--cyan);

}

.status-pill.pilot {

  background: rgba(140,131,255,.16);

  color: #d5d3ff;

}

.status-pill.build {

  background: rgba(255,215,106,.14);

  color: var(--gold);

}

/* ==========================

   MINI STATS

========================== */

.mini-stats {

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 16px;

  margin-top: 24px;

}

.mini-stat {

  padding: 22px;

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,.06);

  background:

    linear-gradient(

      180deg,

      rgba(255,255,255,.04),

      rgba(255,255,255,.015)

    );

  transition: .18s ease;

}

.mini-stat:hover {

  transform: translateY(-3px);

  border-color: var(--line-strong);

  background: rgba(255,255,255,.05);

}

.mini-stat strong {

  display: block;

  font-size: 17px;

  color: #fff;

  margin-bottom: 8px;

  font-weight: 950;

}

.mini-stat span {

  color: var(--muted);

  font-size: 13px;

  line-height: 1.65;

}

/* ==========================

   SUPPORT CALLOUT

   This stays. This is NOT the duplicate AI bubble.

========================== */

.support-callout {

  margin-top: 24px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 18px;

  padding: 22px 24px;

  border-radius: 24px;

  border: 1px solid rgba(109,255,179,.18);

  background:

    linear-gradient(

      135deg,

      rgba(109,255,179,.06),

      rgba(99,245,255,.03)

    );

  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);

}

.support-callout strong {

  display: block;

  color: var(--green);

  margin-bottom: 5px;

  font-size: 16px;

  font-weight: 950;

}

.support-callout span {

  color: var(--muted);

  font-size: 14px;

  line-height: 1.65;

}

/* ==========================

   MAIN SECTION SYSTEM

========================== */

.section {

  position: relative;

  margin-top: 24px;

  padding: 34px;

  border-radius: var(--radius-xl);

  background: var(--panel);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);

  overflow: hidden;

}

.section::before {

  content: "";

  position: absolute;

  inset: 0;

  background:

    radial-gradient(

      circle at top right,

      rgba(99,245,255,.05),

      transparent 40%

    );

  pointer-events: none;

}

.section-header {

  position: relative;

  z-index: 1;

  margin-bottom: 26px;

}

.section h2 {

  font-size: 30px;

  margin-bottom: 8px;

  letter-spacing: -.03em;

  font-weight: 950;

}

.lead {

  max-width: 860px;

  color: var(--muted);

  line-height: 1.75;

  font-size: 15px;

}

/* ==========================

   GRID + CARDS

========================== */

.grid {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 16px;

}

.info-grid {

  display: grid;

  grid-template-columns: 1.1fr .9fr;

  gap: 18px;

  margin-top: 18px;

}

.card,

.highlight,

.list-item,

.service-card {

  border: 1px solid rgba(255,255,255,.05);

  background: rgba(255,255,255,.02);

}

.card {

  position: relative;

  overflow: hidden;

  padding: 22px;

  border-radius: 22px;

  transition: .18s ease;

}

.card:hover {

  transform: translateY(-4px);

  border-color: var(--line-strong);

  background: rgba(255,255,255,.045);

}

.card strong {

  display: block;

  margin-bottom: 8px;

  font-size: 16px;

  color: white;

  font-weight: 950;

}

.card span {

  display: block;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.65;

}

/* ==========================

   SINGLE AI WIDGET CONTROL

   This is the correction for the duplicate AI box.

========================== */

#harvey-ai-chat-root {

  position: fixed;

  z-index: 9998;

}

/* Keep only external widget launcher.

   Do not style or create a second fallback launcher. */

.harvey-ai-launch {

  right: 18px !important;

  bottom: calc(96px + env(safe-area-inset-bottom)) !important;

  z-index: 9998 !important;

}

.harvey-ai-window {

  z-index: 9999 !important;

}/* ==========================

   HIGHLIGHT PANEL

========================== */

.highlight {

  padding: 26px;

/* ==========================================

   STORAGE HELPERS

========================================== */

function storageGet(key, fallback = "") {

  try {

    return localStorage.getItem(key) || fallback;

  } catch {

    return fallback;

  }

}

function storageSet(key, value) {

  try {

    localStorage.setItem(key, value);

  } catch {}

}

/* ==========================================

   ANALYTICS

========================================== */

function track(eventName, data = {}) {

  try {

    if (typeof gtag === "function") {

      gtag("event", eventName, {

        app_name: "Harvey Taxi",

        app_version: HARVEY_APP.version,

        page_location: location.href,

        ...data

      });

    }

  } catch (error) {

    console.warn(error);

  }

}

/* ==========================================

   NAVIGATION

========================================== */

function safeGo(url, eventName) {

  track(

    eventName || "navigation",

    {

      destination: url

    }

  );

  location.href = url;

}

window.safeGo = safeGo;

/* ==========================================

   ACCESSIBILITY

========================================== */

function restoreAccessibility() {

  const highContrast =

    storageGet(

      STORAGE_KEYS.highContrast

    ) === "1";

  const largeText =

    storageGet(

      STORAGE_KEYS.largeText

    ) === "1";

  const reducedMotion =

    storageGet(

      STORAGE_KEYS.reducedMotion

    ) === "1";

  document.body.classList.toggle(

    "high-contrast",

    highContrast

  );

  document.body.classList.toggle(

    "large-text",

    largeText

  );

  document.body.classList.toggle(

    "reduced-motion",

    reducedMotion

  );

}

function toggleSetting(

  className,

  storageKey,

  button

) {

  const active =

    !document.body.classList.contains(

      className

    );

  document.body.classList.toggle(

    className,

    active

  );

  button.classList.toggle(

    "active",

    active

  );

  storageSet(

    storageKey,

    active ? "1" : "0"

  );

  track(

    "accessibility_changed",

    {

      setting: storageKey,

      active

    }

  );

}

function bindAccessibility() {

  document

    .getElementById(

      "contrast-toggle"

    )

    ?.addEventListener(

      "click",

      function () {

        toggleSetting(

          "high-contrast",

          STORAGE_KEYS.highContrast,

          this

        );

      }

    );

  document

    .getElementById(

      "text-toggle"

    )

    ?.addEventListener(

      "click",

      function () {

        toggleSetting(

          "large-text",

          STORAGE_KEYS.largeText,

          this

        );

      }

    );

  document

    .getElementById(

      "motion-toggle"

    )

    ?.addEventListener(

          STORAGE_KEYS.reducedMotion,

          this

        );

      }

    );

}

/* ==========================================

   BATTERY OPTIMIZER

========================================== */

function batteryOptimizer() {

  const memory =

    navigator.deviceMemory || 4;

  const cores =

    navigator.hardwareConcurrency || 4;

  const connection =

    navigator.connection;

  const saveData =

    connection?.saveData || false;

  const slowConnection =

    ["2g", "3g", "slow-2g"]

      .includes(

        connection?.effectiveType

      );

  const lowPower =

    memory <= 2 ||

    cores <= 2 ||

    saveData ||

    slowConnection;

  if (lowPower) {

    document.body.classList.add(

      "reduced-motion"

    );

    storageSet(

      STORAGE_KEYS.reducedMotion,

      "1"

    );

  }

  track(

    "battery_optimizer",

    {

      lowPower,

      memory,

      cores

    }

  );

}

window.applyBatteryOptimizer =

  batteryOptimizer;

async function enableNotifications() {

  if (

    !("Notification" in window)

  ) {

    return false;

  }

  if (

    Notification.permission ===

    "granted"

  ) {

    return true;

  }

  const permission =

    await Notification.requestPermission();

  storageSet(

    STORAGE_KEYS.notifications,

    permission === "granted"

      ? "1"

      : "0"

  );

  track(

    "notification_permission",

    {

      permission

    }

  );

  return (

    permission === "granted"

  );

}

window.requestNotificationPermission =

  enableNotifications;

function showNotification(

  title,

  body

) {

  try {

    if (

      Notification.permission !==

    new Notification(

    );

  } catch {}

}

const TRANSLATIONS = {

  en: {

    requestRide:

      "Request Ride",

    support:

      "Support",

    foundation:

      "Foundation"

  },

  es: {

    requestRide:

      "Solicitar Viaje",

  },

  fr: {

    requestRide:

    foundation:

  }

};

function applyLanguage(

  language

) {

  const selectedLanguage =

    TRANSLATIONS[language]

      ? language

      : "en";

  storageSet(

    STORAGE_KEYS.language,

    selectedLanguage

  );

  document.documentElement.lang =

    selectedLanguage;

  document.documentElement.dir =

    selectedLanguage === "ar"

      ? "rtl"

      : "ltr";

  const elements =

    document.querySelectorAll(

      "[data-i18n]"

    );

  elements.forEach(

    (element) => {

      const key =

        element.dataset.i18n;

      const value =

        TRANSLATIONS[

          selectedLanguage

        ]?.[key];

      if (

        typeof value ===

        "string"

      ) {

        element.textContent =

          value;

      }

    }

  );

  track(

    "language_changed",

    {

      language:

        selectedLanguage

    }

  );

}

window.applyLanguage =

  applyLanguage;

function initializeLanguage() {

  const selector =

    document.getElementById(

      "language-select"

    );

  const savedLanguage =

    storageGet(

      STORAGE_KEYS.language,

      "en"

    );

  if (selector) {

    selector.value =

      savedLanguage;

    selector.addEventListener(

      "change",

      function () {

        applyLanguage(

          this.value

        );

      }

    );

  }

  applyLanguage(

    savedLanguage

  );

}

function bindIntentTracking() {

      const intentTarget =

        event.target.closest(

          "[data-intent]"

        );

      const trackTarget =

        event.target.closest(

          "[data-track]"

        );

      if (intentTarget) {

        track(

          intentTarget.dataset.intent,

          {

            event_category:

              "lead_intent"

          }

        );

        return;

      }

      if (trackTarget) {

        track(

          trackTarget.dataset.track

        );

      }

    }

  );

function startPlatformHeartbeat() {

  fetchPlatformHealth();

  setInterval(

    () => {

      fetchPlatformHealth();

    },

    300000

  );

}

/* ==========================================

   SINGLE AI SANITIZER

   Removes old duplicate fallback AI buttons if cached.

========================================== */

function sanitizeOldAiDuplicates() {

  document

    .querySelectorAll(

      "#harvey-ai-fallback-button, #harvey-ai-fallback-panel"

    )

    .forEach(

      (node) => node.remove()

    );

  const roots =

    document.querySelectorAll(

      "#harvey-ai-chat-root"

    );

  roots.forEach(

    (root, index) => {

      if (index > 0) {

        root.remove();

      }

    }

  );

}

/* ==========================================

   ACTIVE AI ROOT

========================================== */

function ensureAiRoot() {

  sanitizeOldAiDuplicates();

  let root =

    document.getElementById(

      "harvey-ai-chat-root"

    );

  if (!root) {

    root =

      document.createElement(

        "div"

      );

    root.id =

      "harvey-ai-chat-root";

    document.body.appendChild(

      root

    );

  }

  return root;

}

/* ==========================================

   BUTTON STATE RESTORE

========================================== */

function restoreAccessibilityButtonStates() {

  document

    .getElementById(

      "contrast-toggle"

    )

    ?.classList.toggle(

      "active",

      storageGet(

        STORAGE_KEYS.highContrast

      ) === "1"

    );

  document

    .getElementById(

      "text-toggle"

    )

    ?.classList.toggle(

      "active",

      storageGet(

        STORAGE_KEYS.largeText

      ) === "1"

    );

  document

    .getElementById(

      "motion-toggle"

    )

    ?.classList.toggle(

      "active",

      storageGet(

        STORAGE_KEYS.reducedMotion

      ) === "1"

    );

}

/* ==========================================

   APP INITIALIZATION

========================================== */

function initializeHarveyTaxiHome() {

  if (

    HARVEY_APP.initialized

  ) {

    return;

  }

  HARVEY_APP.initialized =

    true;

  ensureAiRoot();

  sanitizeOldAiDuplicates();

  bindIntentTracking();

  bindAccessibility();

  restoreAccessibility();

  restoreAccessibilityButtonStates();

  initializeLanguage();

  batteryOptimizer();

  monitorConnection();

  monitorAI();

  injectQuickSettingsPanel();

  startPlatformHeartbeat();

  registerServiceWorker();

  createWelcomeBanner();

  track(

    "harvey_home_initialized",

    {

      single_ai:

        true,

      banner:

        true

    }

  );

  setTimeout(

    sanitizeOldAiDuplicates,

    500

  );

  setTimeout(

    sanitizeOldAiDuplicates,

    1500

  );

}

document.addEventListener(

  "DOMContentLoaded",

  initializeHarveyTaxiHome

);

window.addEventListener(

  "load",

  () => {

    ensureAiRoot();

    sanitizeOldAiDuplicates();

  }

);

</script>
