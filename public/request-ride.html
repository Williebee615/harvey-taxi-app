<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Harvey Taxi — Request a Ride</title>
  <meta name="robots" content="noindex, follow" />
  <!-- No static target here (unlike request-food.html/request-groceries.html):
       the booking wizard now lives inside rider-dashboard.html and needs
       whatever mode/ride_id/etc. query string this page was loaded with,
       so the redirect target is built in JS instead of a fixed meta-refresh
       URL. The meta-refresh below is only a no-JS fallback. -->
  <meta http-equiv="refresh" content="0; url=/rider-dashboard.html" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040814;
      color: #f4f7ff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a {
      color: #63f5ff;
      font-weight: 800;
    }
  </style>
  <script>
    window.location.replace("/rider-dashboard.html" + window.location.search);
  </script>
</head>
<body>
  <p>
    Redirecting to <a href="/rider-dashboard.html">Harvey Taxi Rider Dashboard</a>...
  </p>
</body>
</html>
