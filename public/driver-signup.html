const $ = (id) => document.getElementById(id);

const APP_STATE = {
  emailVerified: false,
  smsVerified: false,
  personaVerified: false,
  checkrVerified: false,
  applicationSubmitted: false,
  driverId: null
};

function setDebug(message) {
  const box = $("pageDebug");
  if (!box) return;

  const timestamp =
    new Date().toLocaleTimeString();

  box.innerHTML =
    `[${timestamp}] ${message}`;
}

function showStatus(message, type = "info") {

  const box = $("statusMessage");

  if (!box) return;

  box.className =
    `status show ${type}`;

  box.textContent = message;

  window.scrollTo({
    top: box.offsetTop - 120,
    behavior: "smooth"
  });
}

function generateDriverId() {

  const random =
    Math.floor(
      100000 + Math.random() * 900000
    );

  return `HTD-${random}`;
}

function saveDriverSession(data) {

  localStorage.setItem(
    "harvey_driver_session",
    JSON.stringify(data)
  );
}

function loadDriverSession() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "harvey_driver_session"
      )
    );

  } catch {

    return null;

  }
}

function clearDriverSession() {

  localStorage.removeItem(
    "harvey_driver_session"
  );

  APP_STATE.emailVerified = false;
  APP_STATE.smsVerified = false;
  APP_STATE.personaVerified = false;
  APP_STATE.checkrVerified = false;
  APP_STATE.applicationSubmitted = false;

  setDebug(
    "Driver session cleared."
  );
}

function validateForm() {

  const required = [

    "firstName",
    "lastName",
    "email",
    "phone",
    "city",
    "state",
    "licenseNumber",
    "password",
    "vehicleMake",
    "vehicleModel",
    "vehicleYear",
    "licensePlate"

  ];

  for (const fieldId of required) {

    const field = $(fieldId);

    if (!field || !field.value.trim()) {

      showStatus(
        `Missing field: ${fieldId}`,
        "error"
      );

      field?.focus();

      return false;
    }
  }

  if (
    $("password").value.length < 8
  ) {

    showStatus(
      "Password must contain at least 8 characters.",
      "error"
    );

    return false;
  }

  if (
    !$("termsAccepted").checked
  ) {

    showStatus(
      "You must accept onboarding terms.",
      "error"
    );

    return false;
  }

  if (
    !$("backgroundAccepted").checked
  ) {

    showStatus(
      "Background review consent required.",
      "error"
    );

    return false;
  }

  if (
    !$("insuranceConfirmed").checked
  ) {

    showStatus(
      "Insurance confirmation required.",
      "error"
    );

    return false;
  }

  if (
    !$("locationConsent").checked
  ) {

    showStatus(
      "Location consent required.",
      "error"
    );

    return false;
  }

  return true;
}

function updateConsentUI() {

  document
    .querySelectorAll(".consent")
    .forEach((wrapper) => {

      const checkbox =
        wrapper.querySelector(
          "input[type='checkbox']"
        );

      if (!checkbox) return;

      wrapper.classList.toggle(
        "active",
        checkbox.checked
      );

      checkbox.addEventListener(
        "change",
        () => {

          wrapper.classList.toggle(
            "active",
            checkbox.checked
          );

        }
      );
    });
}

function updateVerificationUI() {

    $("emailPill")?.classList.add(

    );

    $("emailPill").textContent =

    );

  }

  if (
    APP_STATE.personaVerified
  ) {

    $("personaPill")?.classList.add(
      "ok"
    );

    $("personaPill").textContent =
      "Approved";
  }

  ) {

function switchToVerification() {

  $("signupSection")
    ?.classList.add("hidden");

  $("verificationSection")
    ?.classList.remove("hidden");

  const session =
    loadDriverSession();

  if (session) {

    $("savedDriverBox")
      ?.classList.add("show");

    $("savedDriverText").textContent =
      `${session.firstName} ${session.lastName} • ${session.driverId}`;

    $("emailTargetText").textContent =
      session.email;

    $("smsTargetText").textContent =
      session.phone;
  }
}

function restoreSessionIfExists() {

  const session =
    loadDriverSession();

  if (!session) return;

  APP_STATE.applicationSubmitted =
    true;

  APP_STATE.driverId =
    session.driverId;

  switchToVerification();

  setDebug(
    "Previous driver session restored."
  );
}/* ==========================================
   FORM SUBMISSION + VERIFICATION ENGINE
========================================== */

function collectDriverPayload() {

  return {
    driverId:
      APP_STATE.driverId ||
      generateDriverId(),

    firstName:
      $("firstName").value.trim(),

    lastName:
      $("lastName").value.trim(),

    email:
      $("email").value.trim().toLowerCase(),

    phone:
      $("phone").value.trim(),

    city:
      $("city").value.trim(),

    state:
      $("state").value.trim().toUpperCase(),

    licenseNumber:
      $("licenseNumber").value.trim(),

    password:
      $("password").value,

    vehicle: {
      make:
        $("vehicleMake").value.trim(),

      model:
        $("vehicleModel").value.trim(),

      year:
        $("vehicleYear").value.trim(),

      color:
        $("vehicleColor").value.trim(),

      plate:
        $("licensePlate").value.trim().toUpperCase()
    },

    services: {
      rides:
        $("supportsRides").checked,

      food:
        $("supportsFood").checked,

      grocery:
        $("supportsGrocery").checked,

      priority:
        $("supportsPriority").checked
    },

    driverType:
      document.querySelector(
        "input[name='driverType']:checked"
      )?.value || "human",

    consents: {
      terms:
        $("termsAccepted").checked,

      background:
        $("backgroundAccepted").checked,

      insurance:
        $("insuranceConfirmed").checked,

      location:
        $("locationConsent").checked
    },

    language:
      localStorage.getItem(
        "harvey_driver_language"
      ) || "en",

    submittedAt:
      new Date().toISOString(),

    status:
      "submitted"
  };
}

async function submitDriverApplication(event) {

  if (event) {
    event.preventDefault();
  }

  if (!validateForm()) {
    return;
  }

  const submitBtn =
    $("submitBtn");

  try {

    submitBtn.disabled = true;
    submitBtn.textContent =
      "Submitting...";

    const payload =
      collectDriverPayload();

    APP_STATE.driverId =
      payload.driverId;

    APP_STATE.applicationSubmitted =
      true;

    saveDriverSession(payload);

    /*
      BACKEND READY:
      If your Render backend endpoint is active,
      this will submit to the server.

      If backend fails, the local saved session
      still lets the page continue safely.
    */

    try {

      const response =
        await fetch(
          "https://harvey-taxi-app-2.onrender.com/api/drivers/signup",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body:
              JSON.stringify(payload)
          }
        );

      if (!response.ok) {
        throw new Error(
          "Server signup endpoint returned an error."
        );
      }

      const data =
        await response.json();

      if (data.driverId || data.id) {
        APP_STATE.driverId =
          data.driverId || data.id;

        payload.driverId =
          APP_STATE.driverId;

        saveDriverSession(payload);
      }

      setDebug(
        "Driver application submitted to backend."
      );

    } catch (serverError) {

      setDebug(
        "Backend unavailable. Local onboarding session saved."
      );

      console.warn(
        "Signup backend fallback:",
        serverError
      );
    }

    switchToVerification();

    showStatus(
      "Driver application submitted. Check your email, then refresh status after verification.",
      "success"
    );

  } catch (error) {

    showStatus(
      error.message ||
        "Driver application could not be submitted.",
      "error"
    );

  } finally {

    submitBtn.disabled = false;
    submitBtn.textContent =
      "Submit Driver Application";

  }
}

async function refreshDriverStatus() {

  const session =
    loadDriverSession();

  if (!session) {

    showStatus(
      "No saved driver session found.",
      "error"
    );

    return;
  }

  try {

    $("refreshStatusBtn").disabled =
      true;

    $("refreshStatusBtn").textContent =
      "Refreshing...";

    let serverData = null;

    try {

      const response =
        await fetch(
          `https://harvey-taxi-app-2.onrender.com/api/drivers/status?driverId=${encodeURIComponent(session.driverId)}`
        );

      if (response.ok) {
        serverData =
          await response.json();
      }

    } catch (error) {

      console.warn(
        "Status backend unavailable:",
        error
      );
    }

    if (serverData) {

      APP_STATE.emailVerified =
        Boolean(
          serverData.emailVerified ||
          serverData.email_verified
        );

      APP_STATE.smsVerified =
        Boolean(
          serverData.smsVerified ||
          serverData.sms_verified ||
          serverData.phone_verified
        );

      APP_STATE.personaVerified =
        Boolean(
          serverData.personaVerified ||
          serverData.persona_status === "approved"
        );

      APP_STATE.checkrVerified =
        Boolean(
          serverData.checkrVerified ||
          serverData.checkr_status === "clear"
        );

    } else {

      /*
        DEV FALLBACK:
        This keeps your UI testable even when backend
        routes are not finished yet.
      */

      APP_STATE.emailVerified =
        APP_STATE.emailVerified || false;

      APP_STATE.smsVerified =
        APP_STATE.smsVerified || false;
    }

    updateVerificationUI();

    showStatus(
      "Driver status refreshed.",
      "success"
    );

  } catch (error) {

    showStatus(
      "Could not refresh driver status.",
      "error"
    );

  } finally {

    $("refreshStatusBtn").disabled =
      false;

    $("refreshStatusBtn").textContent =
      "Refresh Status";
  }
}async function resendEmailVerification() {

    );

  }

      {

  } finally {

  }
}

async function resendSmsCode() {

  const session =
    loadDriverSession();

  if (!session) {
    showStatus(
      "Submit the driver application first.",
      "error"
    );
    return;
  }

  if (!APP_STATE.emailVerified) {
    showStatus(
      "Verify your email before requesting an SMS code.",
      "error"
    );
    return;
  }

  try {

    $("resendSmsBtn").disabled = true;
    $("resendSmsBtn").textContent = "Sending...";

    let devCode = "";

    try {

      const response =
        await fetch(
          "https://harvey-taxi-app-2.onrender.com/api/drivers/send-sms-code",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              driverId: session.driverId,
              phone: session.phone,
              email: session.email
            })
          }
        );

      const data =
        await response.json().catch(() => ({}));

      devCode =
        data.devCode || data.code || "";

    } catch (error) {

      console.warn(
        "SMS backend unavailable:",
        error
      );
    }

    showStatus(
      devCode
        ? `SMS code sent. Development code: ${devCode}`
        : "SMS code requested. Check your phone.",
      "success"
    );

  } finally {

    $("resendSmsBtn").disabled = false;
    $("resendSmsBtn").textContent = "Resend SMS Code";
  }
}

async function verifySmsCode() {

  const session =
    loadDriverSession();

  const code =
    $("smsCode").value
      .replace(/\D/g, "")
      .slice(0, 6);

  if (!session) {
    showStatus(
      "Submit the driver application first.",
      "error"
    );
    return;
  }

  if (code.length !== 6) {
    showStatus(
      "Enter the 6-digit SMS code.",
      "error"
    );
    return;
  }

  try {

    $("verifySmsBtn").disabled = true;
    $("verifySmsBtn").textContent = "Verifying...";

    let verified = false;

    try {

      const response =
        await fetch(
          "https://harvey-taxi-app-2.onrender.com/api/drivers/verify-sms-code",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              driverId: session.driverId,
              code
            })
          }
        );

      const data =
        await response.json().catch(() => ({}));

      verified =
        response.ok &&
        (
          data.ok === true ||
          data.verified === true ||
          data.smsVerified === true
        );

    } catch (error) {

      /*
        DEV FALLBACK:
        Allows test code 123456 while backend is unfinished.
        Remove this fallback after production SMS is fully live.
      */

      verified =
        code === "123456";
    }

    if (!verified) {
      throw new Error(
        "SMS verification failed. Try again."
      );
    }

    APP_STATE.smsVerified = true;
    $("smsCode").value = "";

    updateVerificationUI();

    showStatus(
      "SMS verification complete.",
      "success"
    );

  } catch (error) {

    showStatus(
      error.message || "SMS verification failed.",
      "error"
    );

  } finally {

    $("verifySmsBtn").disabled = false;
    $("verifySmsBtn").textContent = "Verify SMS Code";
  }
}

async function launchPersonaVerification() {

  const session =
    loadDriverSession();

  if (!session) {
    showStatus(
      "Driver session not found.",
      "error"
    );
    return;
  }

  if (!APP_STATE.emailVerified || !APP_STATE.smsVerified) {
    showStatus(
      "Complete email and SMS verification before Persona.",
      "error"
    );
    return;
  }

  try {

    $("launchPersonaBtn").disabled = true;
    $("launchPersonaBtn").textContent = "Starting Persona...";

    const response =
      await fetch(
        "https://harvey-taxi-app-2.onrender.com/api/drivers/start-persona",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            driverId: session.driverId,
            email: session.email,
            phone: session.phone
          })
        }
      );

    const data =
      await response.json().catch(() => ({}));

    const personaUrl =
      data.hostedUrl ||
      data.hosted_url ||
      data.url ||
      data?.persona?.hostedUrl ||
      data?.persona?.hosted_url;

    if (personaUrl) {
      window.location.href = personaUrl;
      return;
    }

    showStatus(
      "Persona session requested. If no window opens, contact support.",
      "success"
    );

  } catch (error) {

    showStatus(
      "Could not start Persona verification.",
      "error"
    );

  } finally {

    $("launchPersonaBtn").disabled = false;
    $("launchPersonaBtn").textContent = "Start Persona Verification";
  }
}

function openDriverDashboard() {

  const session =
    loadDriverSession();

  if (!session?.driverId) {
    showStatus(
      "Driver ID not found.",
      "error"
    );
    return;
  }

  window.location.href =
    `/driver-dashboard.html?driverId=${encodeURIComponent(session.driverId)}`;
}

function startOverDriverSignup() {

  localStorage.removeItem(
    "harvey_driver_signup_session"
  );

  APP_STATE.driverId = "";
  APP_STATE.applicationSubmitted = false;
  APP_STATE.emailVerified = false;
  APP_STATE.smsVerified = false;
  APP_STATE.personaVerified = false;
  APP_STATE.checkrVerified = false;
  APP_STATE.adminApproved = false;

  $("driverSignupForm").reset();

  $("signupSection").classList.remove("hidden");
  $("verificationSection").classList.add("hidden");

  updateVerificationUI();
  updateFormHint();

  showStatus(
    "Driver signup reset.",
    "success"
  );
}function bindFormEvents() {

  $("driverSignupForm")?.addEventListener(
    "submit",
    submitDriverApplication
  );

  $("verifySmsBtn")?.addEventListener(
    "click",
    verifySmsCode
  );

  $("refreshStatusBtn")?.addEventListener(
    "click",
    refreshDriverStatus
  );

  $("resendEmailBtn")?.addEventListener(
    "click",
    resendEmailVerification
  );

  $("resendSmsBtn")?.addEventListener(
    "click",
    resendSmsCode
  );

  $("launchPersonaBtn")?.addEventListener(
    "click",
    launchPersonaVerification
  );

  $("openDashboardBtn")?.addEventListener(
    "click",
    openDriverDashboard
  );

  $("startOverBtn")?.addEventListener(
    "click",
    startOverDriverSignup
  );

  DRIVER_REQUIRED_FIELDS.forEach((fieldId) => {
    const field = $(fieldId);

    if (!field) return;

    field.addEventListener("input", updateFormHint);
    field.addEventListener("change", updateFormHint);
  });

  DRIVER_CONSENT_FIELDS.forEach((fieldId) => {
    const input = $(fieldId);
    const label = input?.closest(".consent");

    if (!input || !label) return;

    label.addEventListener("click", (event) => {
      event.preventDefault();

      input.checked = !input.checked;

      updateConsentUI();
      updateFormHint();
    });
  });

  [
    "supportsRides",
    "supportsFood",
    "supportsGrocery",
    "supportsPriority"
  ].forEach((fieldId) => {
    const input = $(fieldId);

    if (!input) return;

    input.addEventListener("change", () => {
      updateChoiceUI();
      updateFormHint();
    });
  });

  document
    .querySelectorAll('input[name="driverType"]')
    .forEach((input) => {
      input.addEventListener("change", updateChoiceUI);
    });

  $("vehicleYear")?.addEventListener("input", (event) => {
    event.target.value =
      onlyDigits(event.target.value).slice(0, 4);

    updateFormHint();
  });

  $("state")?.addEventListener("input", (event) => {
    event.target.value =
      String(event.target.value || "")
        .replace(/[^a-z]/gi, "")
        .toUpperCase()
        .slice(0, 2);

    updateFormHint();
  });

  $("licensePlate")?.addEventListener("input", (event) => {
    event.target.value =
      normalizePlate(event.target.value);

    updateFormHint();
  });

  $("phone")?.addEventListener("blur", (event) => {
    event.target.value =
      normalizePhone(event.target.value);

    updateFormHint();
  });

  $("email")?.addEventListener("blur", (event) => {
    event.target.value =
      String(event.target.value || "")
        .trim()
        .toLowerCase();

    updateFormHint();
  });

  $("smsCode")?.addEventListener("input", (event) => {
    event.target.value =
      onlyDigits(event.target.value).slice(0, 6);
  });
}

function bindLanguageEvents() {

  const languageSelect =
    $("languageSelect");

  const preferredLanguage =
    detectPreferredLanguage();

  if (languageSelect) {

    languageSelect.value =
      LANGUAGE_PACKS[preferredLanguage]
        ? preferredLanguage
        : "en";

    languageSelect.addEventListener(
      "change",
      () => {
        applyLanguage(languageSelect.value);
      }
    );
  }

  $("contrastBtn")?.addEventListener(
    "click",
    () => {
      toggleAccessibility(
        "high-contrast",
        "harvey_driver_high_contrast",
        $("contrastBtn")
      );
    }
  );

  $("textBtn")?.addEventListener(
    "click",
    () => {
      toggleAccessibility(
        "large-text",
        "harvey_driver_large_text",
        $("textBtn")
      );
    }
  );

  $("motionBtn")?.addEventListener(
    "click",
    () => {
      toggleAccessibility(
        "reduced-motion",
        "harvey_driver_reduced_motion",
        $("motionBtn")
      );
    }
  );

  restoreAccessibilitySettings();
  applyLanguage(preferredLanguage);
}

async function bootDriverSignup() {

  bindLanguageEvents();
  bindFormEvents();

  updateConsentUI();
  updateChoiceUI();
  updateFormHint();

  const savedSession =
    loadDriverSession();

  if (savedSession) {

    APP_STATE.driverId =
      savedSession.driverId || "";

    APP_STATE.applicationSubmitted =
      true;

    $("signupSection")?.classList.add("hidden");
    $("verificationSection")?.classList.remove("hidden");

    updateVerificationUI();

    await refreshDriverStatus(false)
      .catch(() => {
        showStatus(
          "Saved driver session found. Refresh status when ready.",
          "info"
        );
      });
  }

  console.log(
    "[HARVEY DRIVER SIGNUP]",
    "Adaptive language driver signup loaded."
  );
}

document.addEventListener(
  "DOMContentLoaded",
  bootDriverSignup
);/* =========================================
   FINAL SAFETY PATCH
========================================= */

window.addEventListener("error", (event) => {
  console.error(
    "[HARVEY DRIVER SIGNUP ERROR]",
    event.message
  );

  showStatus(
    "A page error occurred. Please refresh and try again.",
    "error"
  );
});

window.addEventListener("unhandledrejection", (event) => {
  console.error(
    "[HARVEY DRIVER SIGNUP PROMISE ERROR]",
    event.reason
  );

  showStatus(
    "A system request failed. Please try again or contact support.",
    "error"
  );
});

/* =========================================
   PUBLIC TEST HELPERS
========================================= */

window.HarveyDriverSignup = {
  state: APP_STATE,
  applyLanguage,
  refreshDriverStatus,
  clearDriverSession,
  openDriverDashboard
};</script>
